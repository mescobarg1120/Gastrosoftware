

# ============================================================
# GASTROSOFTWARE — Configuración local
# ============================================================

spring.application.name=gastrosoftware
server.port=8080

# ============================================================
# MySQL
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/gastro_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username=gastro
spring.datasource.password=gastro1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================================================
# MongoDB
# ============================================================
spring.data.mongodb.uri=mongodb://localhost:27017/gastro_logs

# ============================================================
# Redis
# ============================================================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ============================================================
# RabbitMQ
# ============================================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=rabbit1234